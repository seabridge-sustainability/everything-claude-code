version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log, /sandbox/references]
  read_write: [/sandbox/output, /tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_policies:
  github_readonly:
    name: github-readonly-smoke
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
