name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode')) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: nvidia/deepseek-ai/deepseek-v4-pro
          agent: build
          share: false
          use_github_token: true
          prompt: |
            Follow the repository AGENTS.md, CLAUDE.md, .opencode instructions, and ECC skills before making changes.

            SeaBridgeAI safety overrides:
            - Never authorize or perform repository, source-folder, database, vector-index, cloud-infrastructure, or critical-config deletion.
            - Never run paid API calls, model calls, training jobs, or cost-incurring workflows unless explicit written approval from adelmar@seabridge.ai is present in the issue or PR thread.
            - Keep diffs surgical and preserve unrelated user or agent edits.
            - Do not hardcode secrets. Use repository or organization secrets.
            - Preserve manual review gates: do not auto-send, auto-publish, or auto-post external content beyond the requested GitHub response or PR.
            - Report tests and verification run, and clearly mark anything not live-verified.

            For SeaBridgeAI backend work, mirror the rules in:
            - C:/Users/adelm/SeaBridgeAI/manageesg-backend/AGENTS_SYSTEM.md
            - C:/Users/adelm/SeaBridgeAI/manageesg-backend/AGENTS.md
